name: Forma CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Secret Scanner
        run: node scripts/secret-scan.js

  backend:
    name: Backend CI (Lint, Typecheck, Tests, Architecture)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: forma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Architecture Tests
        working-directory: backend
        run: npm run test:arch

      - name: Unit & Integration Tests (Real PostgreSQL)
        working-directory: backend
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgrespassword@localhost:5432/forma_test
          JWT_ACCESS_SECRET: test_access_secret_min_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_min_32_characters_long
        run: npm run test

  mobile:
    name: Flutter Mobile CI (Analyze, Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze
      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test
